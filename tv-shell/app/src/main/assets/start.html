<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudStream TV</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0b0f; color: #ececf1; font-family: sans-serif; }
.box { max-width: 680px; margin: 0 auto; padding: 40px 24px; }
h1 { font-size: 34px; margin: 0 0 6px; }
h1 span { color: #e50914; }
p { color: #9a9aa8; line-height: 1.6; margin: 6px 0; }
.st { margin: 22px 0 10px; font-weight: bold; color: #9a9aa8; }
button, input { font-family: inherit; color: inherit; }
.srv { display: block; width: 100%; text-align: left; padding: 16px 18px; margin: 8px 0; border-radius: 10px; border: 3px solid transparent; background: #16161d; font-size: 18px; color: #ececf1; }
.srv small { display: block; color: #9a9aa8; font-size: 13px; margin-top: 4px; }
.row { margin-top: 10px; }
.row:after { content: ""; display: table; clear: both; }
input { width: 64%; float: left; background: #20202a; border: 3px solid #2c2c38; border-radius: 10px; padding: 12px; font-size: 18px; color: #ececf1; }
.btn { border: 3px solid transparent; border-radius: 10px; padding: 12px 20px; background: #fff; color: #000; font-weight: bold; font-size: 17px; margin-left: 10px; }
.btn.g { background: #20202a; color: #ececf1; margin-left: 0; }
.srv:focus, .btn:focus, input:focus { border-color: #e50914; outline: none; }
.err { color: #ff6b6b; }
.foot { margin-top: 30px; font-size: 12px; color: #6a6a78; }
</style>
<script>
/* Eski WebView'lerde bile hata görünür olsun */
window.onerror = function (msg, src, line) {
  var el = document.getElementById('msg');
  if (el) el.innerHTML = 'Sayfa hatası: ' + msg + ' (satır ' + line + ')';
};
</script>
</head>
<body>
<div class="box">
  <h1>Cloud<span>Stream</span> TV</h1>
  <p>Telefondaki CloudStream uygulamasını aç. İki cihaz aynı Wi-Fi ağında olmalı.</p>
  <p id="msg" class="err"></p>
  <div class="st" id="state"></div>
  <div id="list"></div>
  <div class="st">Adresi elle gir</div>
  <div class="row">
    <input id="ip" type="text" placeholder="192.168.1.25">
    <button class="btn" id="go">Bağlan</button>
  </div>
  <div class="row"><button class="btn g" id="rescan">Yeniden tara</button></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/* Bilerek eski JavaScript (ES5) ile yazıldı: eski TV WebView'lerinde de çalışsın */
var shell = window.CSShell;
var manual = location.search.indexOf('manual=1') >= 0;
var hasMsg = location.search.indexOf('msg=') >= 0;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function param(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function norm(v) {
  v = v.replace(/^\s+|\s+$/g, '').replace(/\/+$/, '');
  if (!/^https?:\/\//.test(v)) v = 'http://' + v;
  if (!/:\d+$/.test(v)) v += ':8686';
  return v;
}
function setState(html) { $('state').innerHTML = html; }

if (param('msg')) $('msg').innerHTML = esc(param('msg'));

/* WebView sürümü: çok eskiyse uyar */
var cm = /Chrome\/(\d+)/.exec(navigator.userAgent);
var chromeVer = cm ? parseInt(cm[1], 10) : 0;
$('foot').innerHTML = 'WebView: ' + (chromeVer ? 'Chrome ' + chromeVer : 'bilinmiyor') +
  (chromeVer && chromeVer < 58 ? ' — <span class="err">çok eski. Play Store\'dan "Android System WebView" güncellemesi gerekir.</span>' : '');

function scan() {
  setState('Ağda CloudStream aranıyor… (birkaç saniye)');
  $('list').innerHTML = '';
  if (shell) shell.scan();
}

window.__scanResult = function (found, own) {
  var last = shell ? shell.lastServer() : '';
  if (!found.length) {
    setState('Bulunamadı. <span style="font-weight:normal">(Bu cihaz: ' + esc(own || 'ağ yok') + ')</span>');
    $('ip').focus();
    return;
  }
  if (found.length === 1 && !manual) { setState('Bulundu, bağlanıyor…'); shell.connect(found[0]); return; }
  setState('Bulunanlar');
  var html = '';
  for (var i = 0; i < found.length; i++) {
    html += '<button class="srv" data-u="' + esc(found[i]) + '">' + esc(found[i].replace('http://', '')) +
      (found[i] === last ? '<small>son kullanılan</small>' : '') + '</button>';
  }
  $('list').innerHTML = html;
  var first = $('list').getElementsByTagName('button')[0];
  if (first) first.focus();
};

var onCheck = function (url, ok) { if (ok) shell.connect(url); else scan(); };
window.__checkResult = function (url, ok) { onCheck(url, ok); };

$('list').onclick = function (e) {
  var t = e.target;
  while (t && t !== this && !t.getAttribute('data-u')) t = t.parentNode;
  if (t && t.getAttribute && t.getAttribute('data-u')) {
    setState('Bağlanıyor…');
    shell.connect(t.getAttribute('data-u'));
  }
};

$('go').onclick = function () {
  var v = $('ip').value;
  if (!v.replace(/\s/g, '')) { $('ip').focus(); return; }
  var u = norm(v);
  setState(esc(u) + ' deneniyor…');
  onCheck = function (url, ok) {
    if (ok) { setState('Bağlanıyor…'); shell.connect(url); }
    else setState('<span class="err">' + esc(url) + ' yanıt vermedi. Telefonda uygulama açık mı?</span>');
  };
  if (shell) shell.check(u);
};
$('ip').onkeydown = function (e) { if (e.keyCode === 13) $('go').onclick(); };
$('rescan').onclick = function () { onCheck = function (url, ok) { if (ok) shell.connect(url); else scan(); }; scan(); };

/* Kumanda: yukarı/aşağı ile düğmeler arasında gez */
document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k !== 38 && k !== 40) return;
  var els = document.querySelectorAll('button, input');
  var i = -1;
  for (var j = 0; j < els.length; j++) if (els[j] === document.activeElement) i = j;
  var n = els[Math.max(0, Math.min(els.length - 1, i + (k === 40 ? 1 : -1)))];
  if (n) { n.focus(); e.preventDefault(); }
});

if (!shell) {
  setState('Bu sayfa CloudStream TV uygulaması içinde çalışır.');
} else {
  var last = shell.lastServer();
  if (last) $('ip').value = last.replace('http://', '').replace(':8686', '');
  if (last && !manual && !hasMsg) {
    setState(esc(last) + ' bağlanıyor…');
    shell.check(last);
  } else {
    scan();
  }
}
setTimeout(function () {
  if (!document.activeElement || document.activeElement === document.body) $('go').focus();
}, 300);
</script>
</body>
</html>
