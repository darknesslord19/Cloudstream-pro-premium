name: Build CloudStream Dark

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-dark
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use keystore from secrets (optional)
        env:
          KS_B64: ${{ secrets.DARK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dark.jks"
            echo "DARK_KEYSTORE_FILE=$RUNNER_TEMP/dark.jks" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            echo "Using keystore/dark.jks from the repository"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --stacktrace
        env:
          DARK_KEYSTORE_PASSWORD: ${{ secrets.DARK_KEYSTORE_PASSWORD }}
          DARK_KEY_ALIAS: ${{ secrets.DARK_KEY_ALIAS }}
          DARK_KEY_PASSWORD: ${{ secrets.DARK_KEY_PASSWORD }}

      - name: Name APK
        id: apk
        run: |
          VERSION=$(grep -E '^versionName' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p out
          cp app/build/outputs/apk/stable/release/*.apk "out/CloudStreamDark-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDark-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: CloudStream Dark ${{ steps.apk.outputs.version }}
          body: |
            CloudStream Dark ${{ steps.apk.outputs.version }}
            Build: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
