name: Build CloudStream HTML

# Yalnızca html-api dalında çalışır; main dalındaki "Build CloudStream Dark" akışına ve sürümlerine dokunmaz.
on:
  push:
    branches: [ html-api ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: build-html-api
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use keystore from secrets (optional)
        env:
          KS_B64: ${{ secrets.DARK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dark.jks"
            echo "DARK_KEYSTORE_FILE=$RUNNER_TEMP/dark.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (güncelleme - asıl uygulamanın üzerine kurulur)
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/stable/release/*.apk out/CloudStreamDark-HTML-guncelleme.apk
        env:
          DARK_KEYSTORE_PASSWORD: ${{ secrets.DARK_KEYSTORE_PASSWORD }}
          DARK_KEY_ALIAS: ${{ secrets.DARK_KEY_ALIAS }}
          DARK_KEY_PASSWORD: ${{ secrets.DARK_KEY_PASSWORD }}

      - name: Build APK (ayrı kurulum)
        run: |
          sed -i 's|<string name="app_name">CloudStream Dark</string>|<string name="app_name">CloudStream HTML</string>|' app/src/main/res/values/strings.xml
          rm -rf app/build/outputs/apk
          ./gradlew assembleStableRelease -PhtmlSeparate=true --stacktrace
        env:
          DARK_KEYSTORE_PASSWORD: ${{ secrets.DARK_KEYSTORE_PASSWORD }}
          DARK_KEY_ALIAS: ${{ secrets.DARK_KEY_ALIAS }}
          DARK_KEY_PASSWORD: ${{ secrets.DARK_KEY_PASSWORD }}

      - name: Prepare files
        run: |
          cp app/build/outputs/apk/stable/release/*.apk out/CloudStreamHTML-ayri.apk
          cp app/src/main/assets/htmlapi/index.html out/CloudStream.html
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamHTML
          path: out/*

      - name: Publish release (html-api)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete html-api --yes --cleanup-tag || true
          gh release create html-api out/CloudStreamDark-HTML-guncelleme.apk out/CloudStreamHTML-ayri.apk out/CloudStream.html \
            --title "CloudStream HTML (#${{ github.run_number }})" \
            --notes "CloudStreamDark-HTML-guncelleme.apk: mevcut CloudStream Dark üzerine güncelleme olarak kurulur, eklentilerin ve ayarların korunur. CloudStreamHTML-ayri.apk: ayrı uygulama olarak kurulur (eklentileri yeniden eklemen gerekir). CloudStream.html: başka cihazda açılacak tek dosya." \
            --target "${{ github.sha }}" \
            --latest=false
